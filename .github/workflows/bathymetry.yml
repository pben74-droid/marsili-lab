name: Scarica batimetria EMODnet
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  bathymetry:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Installa librerie raster
        run: pip install 'rasterio>=1.3,<2' 'numpy>=1.24,<3'
      - name: Scarica e verifica quote EMODnet
        run: python update_bathymetry.py
      - name: Pubblica griglia
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/bathymetry.json
          git diff --cached --quiet || (git commit -m 'Aggiorna batimetria EMODnet' && git push)
